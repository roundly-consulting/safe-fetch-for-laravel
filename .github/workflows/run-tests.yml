name: run-tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [8.4, 8.5, 8.6]
        laravel: [13.*]
        stability: [prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
          # The oldest graph Laravel 13 allows: Guzzle 7.8.2, which predates the `protocols`
          # option. Composer blocks Guzzle releases with security advisories by default, so the
          # floor is only reachable with that block off — CI-only, nothing is committed.
          - os: ubuntu-latest
            php: 8.4
            laravel: 13.*
            testbench: 11.*
            stability: prefer-lowest

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    env:
      # A real-network test that cannot run fails instead of skipping.
      SAFE_FETCH_REQUIRE_NETWORK_TESTS: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: ${{ matrix.stability == 'prefer-stable' && 'xdebug' || 'none' }}

      - name: Install dependencies
        env:
          COMPOSER_NO_SECURITY_BLOCKING: ${{ matrix.stability == 'prefer-lowest' && '1' || '' }}
        run: |
          # Laravel's 13.x releases before 13.32 predate PHP 8.6 (their session handlers miss
          # create_sid()), so a PHP 8.6 job resolves the framework from 13.32.
          composer require --dev "laravel/framework:${{ matrix.php == 8.6 && '^13.32' || matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Assert the Guzzle major this leg tests
        run: |
          version="$(composer show guzzlehttp/guzzle --format=json | php -r 'echo json_decode(stream_get_contents(STDIN), true)["versions"][0];')"
          echo "guzzlehttp/guzzle ${version}"
          case "${{ matrix.stability }}:${version}" in
            prefer-lowest:7.8.*|prefer-stable:8.*) ;;
            *) echo "unexpected Guzzle ${version} on a ${{ matrix.stability }} leg"; exit 1 ;;
          esac

      - name: Execute tests
        if: matrix.stability == 'prefer-stable'
        run: vendor/bin/pest --coverage --min=95 --coverage-clover=build/clover.xml

      - name: Security core fully covered
        if: matrix.stability == 'prefer-stable'
        run: php bin/core-coverage.php build/clover.xml

      - name: Execute tests (no coverage)
        if: matrix.stability != 'prefer-stable'
        run: vendor/bin/pest --ci

  guzzle-7-latest:
    runs-on: ubuntu-latest
    name: P8.4 - L13.* - Guzzle 7 latest

    env:
      SAFE_FETCH_REQUIRE_NETWORK_TESTS: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          # CI-time only, never committed: the 7.12+ deprecation layer over raw curl options.
          composer require --dev "guzzlehttp/guzzle:^7.16" -W --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Assert Guzzle 7
        run: |
          version="$(composer show guzzlehttp/guzzle --format=json | php -r 'echo json_decode(stream_get_contents(STDIN), true)["versions"][0];')"
          echo "guzzlehttp/guzzle ${version}"
          case "${version}" in 7.*) ;; *) echo "expected Guzzle 7, got ${version}"; exit 1 ;; esac

      - name: Execute tests
        run: vendor/bin/pest --ci
